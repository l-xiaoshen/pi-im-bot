services:
  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    image: pi-im-bot:local
    container_name: pi-im-bot
    init: true
    restart: unless-stopped
    ports:
      - "19335:19335"
    environment:
      BOT_CONFIG_DIR: /app/config
      BOT_DATA_DIR: /app/data
      BOT_WEB_ORIGINS: ${BOT_WEB_ORIGINS:-http://localhost:3000}
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./plugins:/app/plugins
      - type: bind
        source: ./plugin-data
        target: /app/plugin-data
        bind:
          propagation: rshared
      - /var/run/docker.sock:/var/run/docker.sock:ro
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: pi-im-bot-web:local
    container_name: pi-im-bot-web
    init: true
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "3000:3000"
    environment:
      BOT_PUBLIC_ORIGIN: ${BOT_PUBLIC_ORIGIN:-http://localhost:19335}
