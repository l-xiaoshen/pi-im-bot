<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi IM Lab</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/providers.css" />
    <link rel="stylesheet" href="/plugins.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">π</span>
          <div><strong>Pi IM Lab</strong><small>智能 Bot · 开发工作台</small></div>
        </div>
        <nav aria-label="主要功能">
          <button class="nav-item active" data-view="chat"><span>◫</span>聊天测试</button>
          <button class="nav-item" data-view="settings"><span>⚙</span>Bot 设置</button>
          <button class="nav-item" data-view="plugins"><span>◇</span>插件中心</button>
          <button class="nav-item" data-view="resources"><span>⌘</span>MCP 与 Skill</button>
          <button class="nav-item" data-view="jobs"><span>↗</span>后台任务</button>
          <button class="nav-item" data-view="providers"><span>⇄</span>模型与 Provider</button>
          <button class="nav-item" data-view="schedules"><span>◷</span>计划任务</button>
          <button class="nav-item" data-view="onebot"><span>⌁</span>QQ 接入</button>
        </nav>
        <div class="rooms-heading">
          <span>渠道</span><button id="new-room" class="icon-button" aria-label="新建 Mock 渠道">＋</button>
        </div>
        <div id="room-list" class="room-list"></div>
        <div class="sidebar-footer">
          <span id="connection-dot" class="connection-dot"></span><span id="connection-label">连接中</span
          ><small>Pi SDK 1.5</small>
        </div>
      </aside>
      <main id="page" class="page" aria-live="polite"></main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
